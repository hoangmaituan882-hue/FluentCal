name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant (debug installs directly without secrets; release requires keystore secrets)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-android.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FluentCal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Android web assets and sync Capacitor
        run: npm run android:sync

      - name: Resolve version and build variant
        id: meta
        shell: bash
        env:
          INPUT_TYPE: ${{ inputs.build_type }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(node -e 'const fs=require("fs"); const m=fs.readFileSync("src/mobile/version.ts","utf8").match(/MOBILE_VERSION\s*=\s*"([^"]+)"/); console.log(m ? m[1] : "0.3.8");')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VARIANT="${INPUT_TYPE:-debug}"
          if [ "$VARIANT" = "release" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set, falling back to debug APK."
            VARIANT="debug"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "Resolved FluentCal Android v$VERSION ($VARIANT)"

      - name: Decode release keystore (release builds only)
        if: steps.meta.outputs.variant == 'release'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/fluentcal-release.jks"

      - name: Assemble Android APK
        working-directory: android
        shell: bash
        env:
          FLUENTCAL_ANDROID_KEYSTORE: ${{ steps.meta.outputs.variant == 'release' && format('{0}/fluentcal-release.jks', runner.temp) || '' }}
          FLUENTCAL_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.meta.outputs.variant }}" = "release" ]; then
            ./gradlew :app:assembleRelease --console=plain
          else
            ./gradlew :app:assembleDebug --console=plain
          fi

      - name: Package APK and SHA-256 checksum
        id: pkg
        shell: bash
        run: |
          mkdir -p release-out
          VERSION="${{ steps.meta.outputs.version }}"
          VARIANT="${{ steps.meta.outputs.variant }}"
          if [ "$VARIANT" = "release" ]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
            OUT="FluentCal-Android-${VERSION}.apk"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            OUT="FluentCal-Android-${VERSION}-debug.apk"
          fi
          cp "$SRC" "release-out/${OUT}"
          (cd release-out && sha256sum "${OUT}" > "${OUT}.sha256")
          cat "release-out/${OUT}.sha256"
          echo "apk_name=${OUT}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-out/${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentCal-Android-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.variant }}
          path: release-out/*
          retention-days: 30

      - name: Clean up temporary keystore
        if: always() && steps.meta.outputs.variant == 'release'
        run: rm -f "${{ runner.temp }}/fluentcal-release.jks"
